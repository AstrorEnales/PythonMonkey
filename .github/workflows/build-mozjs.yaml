name: 'Build patched mozjs (bigheap)'

# bigheap fork: build only the SpiderMonkey shared library, with setup.sh applying
# patches/spidermonkey-gc-max-bytes.patch (lifts the 4 GiB GC heap cap), on the same
# runners and toolchains as upstream's build-spidermonkey-* jobs. Each library is a
# drop-in replacement for the one inside the official pythonmonkey wheels of the
# release this branch is based on; consumers swap it in themselves.
#
# Runs on every push to a bigheap-* branch. (workflow_dispatch only works once this
# file is on the fork's default branch.)

on:
  push:
    branches:
      - 'bigheap-*'
  workflow_dispatch:

env:
  # don't upgrade outdated brew packages because the process is too slow
  HOMEBREW_NO_INSTALL_UPGRADE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  # apt-get should run in noninteractive mode
  DEBIAN_FRONTEND: noninteractive

defaults:
  run:
    # run with Git Bash on Windows
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mozjs-unix:
    strategy:
      fail-fast: false
      matrix:
        # Linux builds run in an Ubuntu 20.04 container (glibc 2.31, matching the manylinux_2_31 wheels);
        # macos-15 is arm64, macos-15-intel is x86_64. Upstream builds arm64 on macos-14, but only the macos-15
        # images ship llvm@18 (with lld); the minimum macOS version is set by configure, not the runner.
        os: [ 'ubuntu-22.04', 'ubuntu-22.04-arm', 'macos-15-intel', 'macos-15' ]
    runs-on: ${{ matrix.os }}
    container: ${{ (startsWith(matrix.os, 'ubuntu') && 'ubuntu:20.04') || null }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the mozilla-central commit hash to be used
        run: echo "MOZCENTRAL_VERSION=$(cat mozcentral.version)" >> $GITHUB_ENV
      - name: Cache spidermonkey build
        id: cache-spidermonkey
        uses: actions/cache@v4
        with:
          path: |
            ./_spidermonkey_install/*
          key: mozjs-bigheap-${{ env.MOZCENTRAL_VERSION }}-${{ hashFiles('setup.sh', 'patches/**') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Setup container
        if: ${{ startsWith(matrix.os, 'ubuntu') && steps.cache-spidermonkey.outputs.cache-hit != 'true' }}
        run: |
          apt-get update -y
          apt-get install -y sudo libnss3-dev libssl-dev
          apt-get install -y curl make git build-essential
          apt-get install -y zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev # required for pyenv
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata
          echo "AGENT_TOOLSDIRECTORY=/" >> $GITHUB_ENV # do not use the Python installation cached for Ubuntu 22.04
      - name: Setup LLVM
        if: ${{ startsWith(matrix.os, 'ubuntu') && steps.cache-spidermonkey.outputs.cache-hit != 'true' }}
        run: |
          apt-get install -y llvm clang
          apt-get install -y lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 18 # install LLVM version 18
          update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-18 18
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 18
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 18
          clang --version
          clang++ --version
      - name: Setup Python
        if: ${{ startsWith(matrix.os, 'ubuntu') && steps.cache-spidermonkey.outputs.cache-hit != 'true' }}
        run: |
          # Use pyenv to install Python version that is not available via `actions/setup-python`
          unset PYENV_ROOT
          curl -L https://github.com/pyenv/pyenv-installer/raw/master/bin/pyenv-installer | bash
          echo "$HOME/.pyenv/bin" >> $GITHUB_PATH # ~/.bashrc file is not read, so we need to add to GITHUB_PATH manually
          echo "$HOME/.pyenv/shims" >> $GITHUB_PATH
          echo "PYENV_ROOT=$HOME/.pyenv" >> $GITHUB_ENV
          export PATH="$HOME/.pyenv/bin:$PATH"
          pyenv install $PYTHON_VERSION
          pyenv global $PYTHON_VERSION
        env:
          PYTHON_VERSION: '3.10'
      - uses: actions/setup-python@v5
        if: ${{ !startsWith(matrix.os, 'ubuntu') && steps.cache-spidermonkey.outputs.cache-hit != 'true' }}
        with:
          python-version: '3.10'
      - name: Setup XCode
        if: ${{ startsWith(matrix.os, 'macos') && steps.cache-spidermonkey.outputs.cache-hit != 'true' }}
        # Xcode 16.x removed the old linker behaviour (-ld64 or -ld_classic) that SpiderMonkey relies on, so we need to switch to an older version
        run: sudo xcode-select -switch /Applications/Xcode_16.0.app
      - name: Provide lld as the host linker
        if: ${{ startsWith(matrix.os, 'macos') && steps.cache-spidermonkey.outputs.cache-hit != 'true' }}
        # Homebrew has no lld bottles for these runners any more, but the images' preinstalled llvm@18 includes it.
        # Expose only ld64.lld, so the compiler stays Apple clang.
        run: |
          mkdir -p "$RUNNER_TEMP/lld-bin"
          ln -sf "$(brew --prefix llvm@18)/bin/lld" "$RUNNER_TEMP/lld-bin/ld64.lld"
          "$RUNNER_TEMP/lld-bin/ld64.lld" --version
          echo "$RUNNER_TEMP/lld-bin" >> $GITHUB_PATH
      - name: Build spidermonkey
        if: ${{ steps.cache-spidermonkey.outputs.cache-hit != 'true' }}
        run: ./setup.sh
      - name: Upload the mozjs library
        uses: actions/upload-artifact@v4
        with:
          name: spidermonkey-${{ env.MOZCENTRAL_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ./_spidermonkey_install/lib/libmozjs-*.so
            ./_spidermonkey_install/lib/libmozjs-*.dylib
          if-no-files-found: error
          retention-days: 90
  build-mozjs-win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Read the mozilla-central commit hash to be used
        run: echo "MOZCENTRAL_VERSION=$(cat mozcentral.version)" >> $GITHUB_ENV
      - name: Cache spidermonkey build
        id: cache-spidermonkey
        uses: actions/cache@v4
        with:
          path: |
            ./_spidermonkey_install/*
          key: mozjs-bigheap-${{ env.MOZCENTRAL_VERSION }}-${{ hashFiles('setup.sh', 'patches/**') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install dependencies
        if: ${{ steps.cache-spidermonkey.outputs.cache-hit != 'true' }}
        shell: powershell
        run: |
          # cmake and LLVM are already installed in the Github Actions runner
          choco install -y wget make unzip
      - name: Install MozillaBuild
        if: ${{ steps.cache-spidermonkey.outputs.cache-hit != 'true' }}
        run: |
          wget -c -q https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe
          powershell -command 'Start-Process -Wait -FilePath "./MozillaBuildSetup-Latest.exe" -ArgumentList "/S"'
      - name: Build spidermonkey in MozillaBuild environment
        if: ${{ steps.cache-spidermonkey.outputs.cache-hit != 'true' }}
        env:
          # Preserve MozillaBuild v4.0.x behaviour
          # see https://groups.google.com/u/1/a/mozilla.org/g/dev-platform/c/hF51Q3j6ca8
          USE_MINTTY: 0
        run: /c/mozilla-build/start-shell.bat -use-full-path -here ./setup.sh
      - name: Upload the mozjs library
        uses: actions/upload-artifact@v4
        with:
          name: spidermonkey-${{ env.MOZCENTRAL_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          path: ./_spidermonkey_install/lib/mozjs-*.dll
          if-no-files-found: error
          retention-days: 90
